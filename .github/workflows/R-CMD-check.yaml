on:
  push:
    branches: [main]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          - {os: macos-latest,    r: 'release'}
          - {os: windows-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Run the tests as they run locally, the Local Source's among them (skip_on_cran() skips
      # without it). Live tests still skip: they need .Renviron credentials and skip under CI.
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, github::MRCIEU/genetics.binaRies
          needs: check

      # R CMD check --as-cran runs the tests on a library of the declared dependencies only, and
      # genetics.binaRies isn't one (it isn't on CRAN), so the tests can't call it: put its PLINK on
      # the PATH instead, where find_plink() looks next. It downloads the binary on first use.
      - name: Put PLINK on the PATH
        shell: Rscript {0}
        run: |
          plink <- genetics.binaRies::get_plink_binary()
          Sys.chmod(plink, "755")
          stopifnot(file.access(plink, 1) == 0)
          cat(normalizePath(dirname(plink)), "\n", sep = "", file = Sys.getenv("GITHUB_PATH"), append = TRUE)

      # The Local Source reads Store Releases through ogquery in Python, which reticulate (in
      # Suggests) finds through RETICULATE_PYTHON: the local tests and the vignette's local chunks
      # run with it, and skip or show their code unevaluated without it. They never set Python up
      # with uv themselves.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ogquery and point reticulate at it
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ogquery
          python -c "import ogquery.release, ogquery.version; print(ogquery.version.__version__)"
          echo "RETICULATE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
          upload-snapshots: true
